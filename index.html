<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E2347">
<title>Summit Building</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: violet dusk header with the route's elevation profile and sunrise bands, warm snow cards below; one mobile column, icon tab bar at the bottom. */
:root {
  --bg: #FBF8F4;
  --surface: #FFFFFF;
  --surface-2: #F3ECE4;
  --fg: #2E2347;
  --muted: #7A6E8A;
  --line: #E8DFD5;
  --accent: #FF6B3D;
  --accent-2: #FFB347;
  --accent-fg: #FFFFFF;
  --accent-soft: #FFE6DA;
  --ice: #7A3E8F;
  --ice-soft: #F1E8F6;
  --night: #2E2347;
  --night-2: #4A2F66;
  --night-fg: #FBF8F4;
  --night-muted: #C9B8DC;
  --band-1: #7A3E8F; --band-2: #E2546A; --band-3: #FF7A45; --band-4: #FFB347;
  --route: #5C4A78;
  --ok: #1E9E6A;
  --warn: #E89A00;
  --bad: #D93A3A;
  --c-a: #FF6B3D; --c-b: #E2546A; --c-c: #7A3E8F; --c-d: #E89A00; --c-out: #1B9AAA;
  --shadow: 0 1px 2px rgba(46, 35, 71, .06), 0 6px 18px rgba(46, 35, 71, .07);
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #140F1D; --surface: #1F1830; --surface-2: #2A2140; --fg: #F4EEF8; --muted: #A99BBB; --line: #352A4D;
    --accent: #FF8355; --accent-2: #FFC164; --accent-fg: #FFFFFF; --accent-soft: #3D2219; --ice: #C08BD6; --ice-soft: #2C2040;
    --night: #0E0A16; --night-2: #2A1C40; --night-fg: #FBF8F4; --night-muted: #B3A3C9;
    --route: #4A3B63;
    --ok: #3CCB8A; --warn: #F5B53A; --bad: #F2645A;
    --c-a: #FF8355; --c-b: #F06D82; --c-c: #B07BD0; --c-d: #F5B53A; --c-out: #3CC1CF;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #140F1D; --surface: #1F1830; --surface-2: #2A2140; --fg: #F4EEF8; --muted: #A99BBB; --line: #352A4D;
  --accent: #FF8355; --accent-2: #FFC164; --accent-fg: #FFFFFF; --accent-soft: #3D2219; --ice: #C08BD6; --ice-soft: #2C2040;
  --night: #0E0A16; --night-2: #2A1C40; --night-fg: #FBF8F4; --night-muted: #B3A3C9;
  --route: #4A3B63;
  --ok: #3CCB8A; --warn: #F5B53A; --bad: #F2645A;
  --c-a: #FF8355; --c-b: #F06D82; --c-c: #B07BD0; --c-d: #F5B53A; --c-out: #3CC1CF;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
img { max-width: 100%; }
.thumbs button { border: 0; padding: 0; background: none; }
.thumbs img:not([src]) { background: var(--surface-2); }
.hpill.sync { cursor: pointer; background: rgba(255, 255, 255, .08); }
.sendbar { position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 6; padding-block: 8px; pointer-events: none; }
.sendbar .btn { pointer-events: auto; padding-block: 13px; font-size: 15px; }
body:has(#sendBar:not([hidden])) main { padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
.hpill.sync.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--night); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header: dusk band, elevation profile, sunrise bands, snow ridge */
.top { position: relative; color: var(--night-fg); background: var(--night); overflow: hidden; }
.top .wrap { position: relative; padding-block: 12px 10px; display: flex; flex-direction: column; gap: 8px; }
.bands { height: 28px; display: grid; grid-template-rows: repeat(4, 1fr); }
.bands i { display: block; }
.bands i:nth-child(1) { background: var(--band-1); } .bands i:nth-child(2) { background: var(--band-2); }
.bands i:nth-child(3) { background: var(--band-3); } .bands i:nth-child(4) { background: var(--band-4); }
.ridge-wrap { height: 0; position: relative; }
.ridge { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 28px; display: block; }
.ridge path { fill: var(--bg); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-style: italic; font-size: 26px; letter-spacing: .02em; line-height: 1; }
.brand-name span { color: var(--accent-2); }
.brand-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hpill { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--night-muted); border: 1px solid rgba(255, 255, 255, .18); border-radius: 999px; padding: 4px 10px; background: transparent; }
.hpill b { color: var(--night-fg); font-family: var(--font-display); font-size: 15px; letter-spacing: 0; }
.hpill.hot { background: var(--accent); border-color: var(--accent); color: #fff; }
.hpill.hot b { color: #fff; }
.alt { display: flex; flex-direction: column; gap: 2px; }
.alt-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; color: var(--night-muted); }
.alt-head b { font-family: var(--font-display); font-size: 22px; color: var(--accent-2); font-style: italic; }
.alt svg { width: 100%; height: auto; max-height: 72px; display: block; overflow: visible; }
.alt .route { fill: none; stroke: var(--route); stroke-width: 3; stroke-linejoin: round; }
.alt .done { fill: none; stroke: var(--accent-2); stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
.alt .camp { fill: var(--night-muted); }
.alt .me { fill: var(--accent-2); stroke: var(--night); stroke-width: 3; }
.alt .peak { fill: var(--night-fg); }
.datebar { display: flex; align-items: center; gap: 8px; }
.datebar .dlabel { flex: 1; text-align: center; font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--night-fg); background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .16); border-radius: 12px; padding: 7px 8px; }
.top .iconbtn { color: var(--night-fg); background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .18); }
.iconbtn { width: 42px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 22px; line-height: 1; }
.gain { font-size: 12px; font-weight: 700; color: rgba(255, 255, 255, .95); background: rgba(0, 0, 0, .14); border-radius: 999px; padding: 3px 10px; align-self: flex-start; }

/* main + tabs */
main { padding-block: 16px calc(92px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); box-shadow: 0 -4px 20px rgba(13, 22, 38, .08); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; padding-block: 6px; }
.tabs button { border: 0; background: none; padding: 6px 0 5px; border-radius: 12px; font-size: 11px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-current="page"] { color: var(--accent); }
.tabs button[aria-current="page"] svg { background: var(--accent-soft); border-radius: 8px; padding: 2px; width: 30px; margin-inline: -4px; }

/* cards & type */
.card { background: var(--surface); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: var(--shadow); }
.card.flat { background: transparent; box-shadow: none; border: 2px dashed var(--line); }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 23px; line-height: 1.1; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 700; font-size: 16px; margin: 0; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.pre { white-space: pre-line; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
p { margin: 0; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* forms */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); font-weight: 600; min-width: 0; }
input[type=text], input[type=time], input[type=date], input[type=password], input[type=search], input:not([type]), select, textarea {
  width: 100%; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 11px; color: var(--fg); font-size: 16px; min-width: 0;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
textarea { min-height: 70px; resize: vertical; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 16px; font-weight: 700; font-size: 14px; }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-fg); border-color: transparent; box-shadow: 0 4px 14px rgba(255, 90, 31, .3); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn.wide { width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

/* scales */
.scale { display: grid; gap: 4px; }
.scale button { border: 0; background: var(--surface-2); border-radius: 9px; padding: 8px 0; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.scale button[aria-pressed="true"] { color: #fff; background: var(--accent); transform: scale(1.06); }
.scale button[aria-pressed="true"].s-ok { background: var(--ok); }
.scale button[aria-pressed="true"].s-warn { background: var(--warn); }
.scale button[aria-pressed="true"].s-bad { background: var(--bad); }
.qlabel { font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }

/* today hero */
.today-hero { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.ring { width: 92px; height: 92px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { fill: none; stroke: var(--surface-2); stroke-width: 10; }
.ring .val { fill: none; stroke: url(#ringGrad); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.ring .lbl { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.ring .lbl b { font-family: var(--font-display); font-size: 28px; font-weight: 700; }
.ring .lbl span { font-size: 11px; color: var(--muted); font-weight: 600; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: 14px; font-weight: 600; }
.checks span { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.checks span.on { color: var(--fg); }
.checks i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-size: 11px; color: #fff; }
.checks span.on i { background: var(--ok); border-color: var(--ok); }
.streak { display: flex; align-items: baseline; gap: 6px; font-weight: 600; color: var(--muted); font-size: 13px; }
.streak b { font-family: var(--font-display); font-style: italic; font-size: 26px; color: var(--accent); }
.msg { border-left: 4px solid var(--accent); padding: 2px 0 2px 12px; display: flex; flex-direction: column; gap: 4px; }

/* workout */
.session-head { color: #fff; background: var(--sess, var(--accent)); background-image: linear-gradient(135deg, rgba(255, 255, 255, .0) 30%, rgba(255, 255, 255, .18) 100%); position: relative; overflow: hidden; }
.session-head .eyebrow, .session-head .muted { color: rgba(255, 255, 255, .85); }
.session-head .code { position: absolute; right: -6px; bottom: -28px; font-family: var(--font-display); font-weight: 700; font-style: italic; font-size: 130px; line-height: 1; opacity: .18; pointer-events: none; }
.session-head h2 { font-size: 28px; font-style: italic; }
.session-head .pill { background: rgba(255, 255, 255, .22); color: #fff; }
.setup { border: 2px solid var(--ice); background: var(--ice-soft); box-shadow: none; }
.setup .eyebrow { color: var(--ice); }
.setup ul, .swap ol, .info ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-left: 4px solid var(--sess, var(--accent)); padding-left: 10px; margin-left: -16px; padding-block: 2px; }
.ex { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.block-head + .ex, .block-head + .note + .ex { border-top: 0; padding-top: 0; }
.ex-name { background: none; border: 0; padding: 0; text-align: left; font-weight: 700; font-size: 17px; color: var(--fg); display: inline-flex; align-items: center; gap: 6px; }
.ex-name::after { content: "i"; font-size: 11px; font-weight: 700; font-style: italic; width: 18px; height: 18px; border-radius: 50%; background: var(--surface-2); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.ex-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: 12px; font-weight: 700; background: var(--surface-2); border-radius: 8px; padding: 3px 9px; font-variant-numeric: tabular-nums; }
.pill.load { background: var(--accent-soft); color: var(--accent); }
.setrow { display: grid; grid-template-columns: 32px 1fr 1fr 44px; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.setrow.nokg { grid-template-columns: 32px 1fr 44px; }
.setrow input[type=text] { padding: 8px; text-align: center; font-weight: 600; }
.setrow .sn { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--surface-2); border-radius: 8px; text-align: center; padding: 6px 0; }
.chk { display: flex; align-items: center; justify-content: center; }
.chk input, .done-line input { width: 24px; height: 24px; accent-color: var(--ok); }
.done-line { display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 600; }
.swap { box-shadow: none; border: 0; background:
  repeating-linear-gradient(-45deg, var(--accent-soft) 0 14px, var(--surface) 14px 28px); }
.swap h2 { color: var(--accent); font-style: italic; }
.swap ol { background: var(--surface); border-radius: 12px; padding: 12px 12px 12px 30px; }
.note { font-size: 13px; color: var(--muted); }

/* meals */
.meal { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; }
.meal:first-of-type { border-top: 0; padding-top: 0; }
.meal ul { margin: 0; padding-left: 18px; }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
.thumbs img { width: 68px; height: 68px; object-fit: cover; border-radius: 10px; }
.item-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); border-radius: 12px; padding: 10px; box-shadow: var(--shadow); }
.item-row .full { grid-column: 1 / -1; }
.totals { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.meter { display: flex; flex-direction: column; gap: 6px; }
.meter .v { font-family: var(--font-display); font-size: 34px; font-style: italic; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.meter .bar { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.meter .bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 5px; }
.meter.p .bar span { background: linear-gradient(90deg, var(--ice), #7DB4FF); }

/* progress */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { background: var(--surface); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; box-shadow: var(--shadow); border-top: 4px solid var(--tile, var(--accent)); }
.tile .v { font-family: var(--font-display); font-weight: 700; font-style: italic; font-size: 32px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .band { fill: var(--ok); opacity: .14; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 3; }
.chart .dot { fill: var(--muted); opacity: .6; }
.chart .bar { fill: var(--accent); }
.chart .bar-ice { fill: var(--ice); }
.chart .d-ok { fill: var(--ok); } .chart .d-warn { fill: var(--warn); } .chart .d-bad { fill: var(--bad); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* calendar */
.cal { display: flex; flex-direction: column; }
.calday { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.calday:first-child { border-top: 0; }
.dn { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1; text-align: center; background: var(--surface-2); border-radius: 12px; padding: 6px 0; border-bottom: 4px solid var(--sess, transparent); }
.calday.today .dn { background: var(--accent); color: #fff; }
.calday.today .dn small { color: rgba(255, 255, 255, .85); }
.dn small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
.calbody { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.calbody select { padding: 6px 8px; font-size: 14px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--fg); font-weight: 700; text-align: left; font-size: 15px; }
.status { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 8px; background: var(--surface-2); text-transform: uppercase; letter-spacing: .04em; }
.status.ev { background: var(--c-d); color: #fff; }
.status.ok { background: var(--ok); color: #fff; } .status.skip { background: var(--bad); color: #fff; } .status.min { background: var(--warn); color: #fff; }

/* catalog */
.cat-item { display: flex; justify-content: space-between; gap: 10px; align-items: center; border: 0; border-top: 1px solid var(--line); background: none; padding: 11px 0; text-align: left; width: 100%; }
.cat-item:first-of-type { border-top: 0; }
.cat-item span:first-child { font-weight: 700; }
.sec { display: flex; flex-direction: column; gap: 6px; }
.sec ol, .sec ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 3px; }
.knee { background: var(--ok); color: #fff; border-radius: 12px; padding: 12px 14px; }

/* profile */
.timeline { display: flex; flex-direction: column; }
.ph { display: grid; grid-template-columns: 16px 1fr; gap: 12px; padding-bottom: 14px; position: relative; }
.ph::before { content: ""; position: absolute; left: 7px; top: 18px; bottom: 0; width: 2px; background: var(--line); }
.ph:last-child::before { display: none; }
.ph .dotc { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--line); margin-top: 3px; background: var(--surface); position: relative; z-index: 1; }
.ph.cur .dotc { background: var(--accent); border-color: var(--accent-soft); box-shadow: 0 0 0 4px var(--accent-soft); }
.ph.past .dotc { background: var(--ok); border-color: var(--ok); }

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const today = () => iso(new Date());
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const ZILE = ['duminică', 'luni', 'marți', 'miercuri', 'joi', 'vineri', 'sâmbătă'];
const ZS = ['Du', 'Lu', 'Ma', 'Mi', 'Jo', 'Vi', 'Sâ'];
const LUNI = ['ian', 'feb', 'mar', 'apr', 'mai', 'iun', 'iul', 'aug', 'sep', 'oct', 'nov', 'dec'];
const fmtDate = s => { const d = parse(s); return `${ZILE[d.getDay()]}, ${d.getDate()} ${LUNI[d.getMonth()]}`; };
const fmtShort = s => { const d = parse(s); return `${d.getDate()} ${LUNI[d.getMonth()]}`; };
const toNum = v => { const t = String(v ?? '').replace(',', '.').trim(); if (t === '') return null; const n = Number(t); return isFinite(n) ? n : null; };
const fmtN = (v, dec = 1) => v == null || isNaN(v) ? '–' : Number(v).toLocaleString('ro-RO', { maximumFractionDigits: dec });
const uid = () => 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const kneeCls = v => v == null ? '' : v <= 3 ? 's-ok' : v <= 5 ? 's-warn' : 's-bad';

const KINDS = [['', '— nesetat —'], ['acasa', 'Antrenament acasă'], ['sala', 'Sală'], ['afara', 'Afară (drumeție, înot…)'], ['kineto', 'Kineto'], ['odihna', 'Odihnă'], ['indisponibil', 'Indisponibil']];
const SKIP = ['Obosit', 'Ocupat', 'Durere genunchi', 'Fără chef', 'Plecat', 'După party', 'Bolnav', 'Altul'];
const MEALT = [['mic-dejun', 'Mic dejun'], ['pranz', 'Prânz'], ['cina', 'Cină'], ['gustare', 'Gustare']];
const SRC = [['acasa', 'Acasă'], ['meniu', 'Meniul zilei'], ['glovo', 'Glovo / livrare'], ['restaurant', 'Restaurant']];
const PREP = ['', 'crud', 'fiert', 'la grătar', 'la cuptor', 'prăjit', 'altul'];
const OUT = [['drumetie', 'Drumeție'], ['plimbare', 'Plimbare'], ['inot', 'Înot'], ['bicicleta', 'Bicicletă'], ['altul', 'Altul']];

const S = { index: {}, ready: {}, sync: 'ok', tab: 'azi', date: today(), profile: null, days: {}, plans: {}, catalog: {}, msgMap: {}, favMap: {}, messages: [], favorites: [], fallback: {}, range: 30, calStart: null, confirm: null };
try { const t = localStorage.getItem('dsp-tab'); if (t) S.tab = t; } catch (e) {}
if (/^#(azi|mancare|progres|calendar|catalog|profil)$/.test(location.hash)) S.tab = location.hash.slice(1);

/* ---------- GitHub storage ---------- */
// Data lives in a private repo: days/YYYY-MM.json, plan/YYYY-MM.json, messages/YYYY-MM.json keyed by date/id,
// plus catalog.json, favorites.json, config/profile.json. Edits stay on the device (QUEUE) until the user reviews them
// and taps "Trimite"; then everything, photos included, goes up as ONE commit through the Git Data API.
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }

const GH = store.get('dsp-gh', null) || { owner: 'nutiumihai-dot', repo: 'drumul-spre-partie-date', branch: 'main', token: '' };
let QUEUE = store.get('dsp-queue', []);
const FILES = {};
const loadedMonths = new Set();
const enc = s => { const b = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); };

async function gh(path, opts = {}) {

}
async function readFile(path) {
  const r = await gh(`/contents/${cpath(path)}?ref=${encodeURIComponent(GH.branch)}`);
  if (r.status === 404) return (FILES[path] = { sha: null, data: null });
  if (!r.ok) throw new GhError(r.status, await r.text());

async function ghJson(path, opts) {

  if (!r.ok) throw new GhError(r.status, await r.text());

}
function errText(e) {
  if (e?.status === 0) return 'Ești offline. Notițele rămân pe dispozitiv; le trimiți când ai internet.';
  if (e?.status === 401) return 'GitHub nu recunoaște tokenul (401). Copiază-l din nou, complet, sau generează unul nou.';
  if (e?.status === 403) return 'Tokenul nu are voie să scrie (403). Verifică permisiunea Contents: Read and write.';
  if (e?.status === 404) return 'Tokenul nu vede repo-ul de date (404). Verifică numele repo-ului și accesul tokenului la el.';
  return 'Trimiterea nu a reușit. Notițele au rămas pe dispozitiv; încearcă din nou.';
}
function applyLocal(op) {
  if (op.photo) return;
  if (op.file.startsWith('days/')) S.days[op.key] = merge(S.days[op.key], op.patch);
  else if (op.file === 'favorites.json') S.favMap[op.key] = merge(S.favMap[op.key], op.patch);
  else if (op.file === 'catalog.json') S.catalog[op.key] = merge(S.catalog[op.key], op.patch);
  else if (op.file === 'config/profile.json') S.profile = merge(S.profile, op.patch);
}
function saveQueue() {
  if (!store.set('dsp-queue', QUEUE)) toast('Memoria dispozitivului e plină (probabil din cauza pozelor). Trimite notițele acum.');
}
function queueOp(op) {
  QUEUE.push(op); saveQueue();
  applyLocal(op); cacheSave(); schedule();
}

/* What changed, in words, for the review sheet and the commit message */
const LABELS = {
  kind: 'Tipul zilei', weight: 'Greutate dimineața', steps: 'Pași', sleepHours: 'Somn azi-noapte (ore)', wake: 'Trezire (1–5)', party: 'Party seara',
  'log.completed': 'Antrenament', 'log.skipReason': 'Motiv', 'log.rpe': 'Efort (RPE)', 'log.painDuring': 'Durere în timpul antrenamentului',
  'log.painEvening': 'Durere seara', 'log.painMorning': 'Durere a doua zi dimineață', 'log.stiffness': 'Rigiditate', 'log.energy': 'Energie',
  'log.swelling': 'Umflare', 'log.feel': 'Cum s-a simțit (1–5)', 'log.feelNote': 'Cum a fost', 'log.kneeling': 'Disconfort la sprijin', 'log.notes': 'Notițe antrenament',
  'outdoor.type': 'Ieșire: tip', 'outdoor.minutes': 'Ieșire: durată (min)', 'outdoor.km': 'Ieșire: distanță (km)', 'outdoor.up': 'Ieșire: urcare (m)',
  'outdoor.down': 'Ieșire: coborâre (m)', 'outdoor.kneeDown': 'Ieșire: genunchi la coborâre', 'outdoor.notes': 'Ieșire: notițe', 'outdoor.photos': 'Ieșire: poze',
  userNotes: 'Notițele tale', kinetoNotes: 'Notițe de la kineto', avoid: 'Exerciții de evitat', name: 'Nume'

const COMPLETED = { complet: 'complet', partial: 'parțial', minim: 'varianta minimă', sarit: 'sărit' };
const KINDN = Object.fromEntries(KINDS);
function showVal(v) {
  if (v == null || v === '') return 'șters';
  if (v === true) return 'da'; if (v === false) return 'nu';
  if (Array.isArray(v)) return v.length + ' elemente';
  const s = String(v); return s.length > 70 ? s.slice(0, 70) + '…' : s;
}
function exName(id) { return S.catalog[id]?.name || id; }
function describe(patch) {
  const lines = [];
  const walk = (o, pre) => Object.entries(o).forEach(([k, v]) => {
    const p = pre ? `${pre}.${k}` : k;
    if (p === 'date') return;
    if (p === 'events') { lines.push(['Ocazii', v.length ? v.map(eventLine).join(' · ') : 'toate șterse']); return; }
    if (p === 'cardio') { lines.push(['Cardio', v.length ? v.map(cardioLine).join(' · ') : 'tot șters']); return; }
    if (p === 'meals') { lines.push(['Mese', v.length ? v.map(m => `${MEALT.find(x => x[0] === m.type)?.[1] || m.type}${m.time ? ' ' + m.time : ''}: ${(m.items || []).map(i => i.name).join(', ') || 'poze'}`).join(' · ') : 'toate șterse']); return; }
    if (pre === 'log.sets') { lines.push([`Serii · ${exName(k)}`, (v || []).map(s => `${s.kg != null ? s.kg + ' kg × ' : ''}${s.reps ?? '?'}${s.done ? ' ✓' : ''}`).join(', ')]); return; }
    if (pre === 'log.done') { lines.push([`Făcut · ${exName(k)}`, showVal(v)]); return; }
    if (pre === 'log.changes') { lines.push([exName(k), v ? changeLine(v) : 'ca în plan']); return; }
    if (p === 'log.changes' && v == null) return;
    if (p === 'outdoor.photos') { lines.push([LABELS[p], `${(v || []).length}`]); return; }
    if (isObj(v)) { walk(v, p); return; }
    let val = showVal(v);
    if (p === 'kind') val = KINDN[v] || val;
    if (p === 'log.completed') val = COMPLETED[v] || val;
    if (p === 'outdoor.type') val = OUT.find(x => x[0] === v)?.[1] || val;
    lines.push([LABELS[p] || p, val]);

}
function pendingGroups() {
  const groups = new Map();
  QUEUE.forEach(o => {
    if (o.photo) { const g = groups.get('photos') || { title: 'Poze noi', lines: [] }; g.lines.push([o.file.split('/').pop(), 'poză']); groups.set('photos', g); return; }
    const gk = `${o.file}|${o.key ?? ''}`;
    const g = groups.get(gk) || { file: o.file, key: o.key, patch: {} };
    g.patch = merge(g.patch, o.patch); groups.set(gk, g);
  });
  return [...groups.values()].map(g => {
    if (g.lines) return g;
    let title = 'Altele';
    if (g.file.startsWith('days/')) title = fmtDate(g.key);
    else if (g.file === 'favorites.json') title = `Masă favorită: ${g.patch.name || S.favMap[g.key]?.name || ''}`;
    else if (g.file === 'catalog.json') title = `Catalog: ${exName(g.key)}`;
    else if (g.file === 'config/profile.json') title = 'Profil';
    return { title, sortKey: g.key || 'zz', lines: describe(g.patch) };

function commitMessage(ops) {
  const days = [...new Set(ops.filter(o => o.file.startsWith('days/')).map(o => o.key))].sort().map(fmtShort);
  const parts = [];
  if (days.length) parts.push(days.join(', '));
  const np = ops.filter(o => o.photo).length;
  if (np) parts.push(np === 1 ? '1 poză' : `${np} poze`);
  if (ops.some(o => o.file === 'favorites.json')) parts.push('favorite');
  if (ops.some(o => o.file === 'catalog.json')) parts.push('catalog');
  if (ops.some(o => o.file === 'config/profile.json')) parts.push('profil');

// Photos live on their own branch ("poze") so the coach can rebuild it weekly and drop processed photos for good,
// without rewriting the history of the journal on main.
const PHOTO_BRANCH = 'poze';
async function commitTo(branch, build, message) {
  for (let attempt = 0; attempt < 3; attempt++) {
    let head = null, baseTree = null;
    const r = await gh(`/git/ref/heads/${branch}`);
    if (r.ok) { head = (await r.json()).object.sha; baseTree = (await ghJson(`/git/commits/${head}`)).tree.sha; }
    else if (r.status !== 404 && r.status !== 409) throw new GhError(r.status, await r.text());
    const { entries, written } = await build(head);
    const t = await ghJson('/git/trees', { method: 'POST', body: JSON.stringify(baseTree ? { base_tree: baseTree, tree: entries } : { tree: entries }) });
    const c = await ghJson('/git/commits', { method: 'POST', body: JSON.stringify({ message, tree: t.sha, parents: head ? [head] : [] }) });
    const u = head
      ? await gh(`/git/refs/heads/${branch}`, { method: 'PATCH', body: JSON.stringify({ sha: c.sha, force: false }) })
      : await gh('/git/refs', { method: 'POST', body: JSON.stringify({ ref: `refs/heads/${branch}`, sha: c.sha }) });

  const r = await gh(`/contents/${cpath(path)}?ref=${encodeURIComponent(ref)}`);

  if (!r.ok) throw new GhError(r.status, await r.text());
  return dec((await r.json()).content);
}

  if (o.mealsEst) {

  }
  if (o.replace) { const out = { ...data }; if (o.patch == null) delete out[o.key]; else out[o.key] = o.patch; return out; }

}
function prependJournal(text, add, date) {
  const lines = (text || '# Jurnalul antrenorului\n').split('\n');
  const head = `## ${date}`;
  const at = lines.indexOf(head);
  if (at >= 0) lines.splice(at + 1, 0, ...add.split('\n'));
  else {
    const first = lines.findIndex(l => l.startsWith('## '));
    const block = [head, ...add.split('\n'), ''];

}
let sending = false;
async function sendAll(ops = [...QUEUE], message = commitMessage(ops), fromQueue = true) {
  if (sending || !ops.length || !GH.token) return false;
  sending = true; S.sync = 'sending'; renderChrome();
  let ok = false;
  try {
    const photos = ops.filter(o => o.photo);
    if (photos.length) {
      await commitTo(PHOTO_BRANCH, async () => {
        const entries = [];

      }, `Poze: ${photos.length}`);
    }
    const rest = ops.filter(o => !o.photo);
    if (rest.length) {
      const written = await commitTo(GH.branch, async head => {
        const entries = [], written = {};

const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const isNum = v => typeof v === 'number' && isFinite(v);
function parseCoachAnswer(text) {
  const fence = [...String(text).matchAll(/```(?:json)?\s*([\s\S]*?)```/g)].pop();
  let raw = fence ? fence[1] : String(text);
  if (!fence) { const a = raw.indexOf('{'), b = raw.lastIndexOf('}'); raw = a >= 0 && b > a ? raw.slice(a, b + 1) : raw; }
  let j;
  try { j = JSON.parse(raw); } catch (e) { throw new Error('Nu găsesc un bloc JSON valid. Copiază tot răspunsul, inclusiv blocul de la final.'); }
  if (!isObj(j)) throw new Error('Blocul JSON trebuie să fie un obiect.');
  const allowed = ['messages', 'meals_est', 'coach', 'plans', 'index', 'journal'];
  const extra = Object.keys(j).filter(k => !allowed.includes(k));
  if (extra.length) throw new Error(`Răspunsul conține câmpuri neacceptate: ${extra.join(', ')}.`);
  const ops = [], preview = [];
  (j.messages || []).forEach(m => {
    if (!isObj(m) || !isDate(m.date) || typeof m.id !== 'string' || !/^[\w.-]{6,60}$/.test(m.id) || typeof m.title !== 'string' || typeof m.body !== 'string') throw new Error('Un mesaj nu are formatul corect (id, date, title, body).');
    const msg = { id: m.id, date: m.date, kind: ['feedback', 'zilnic', 'săptămânal'].includes(m.kind) ? m.kind : 'feedback', title: m.title.slice(0, 120), body: m.body.slice(0, 3000), ts: new Date().toISOString() };
    ops.push({ file: `messages/${m.date.slice(0, 7)}.json`, key: m.id, replace: true, patch: msg });
    preview.push(['Mesaj nou', `${msg.title}`]);
  });
  Object.entries(j.meals_est || {}).forEach(([d, map]) => {
    if (!isDate(d) || !isObj(map)) throw new Error('meals_est are o dată sau un format greșit.');
    const meals = S.days[d]?.meals || [];
    const est = {};
    Object.entries(map).forEach(([id, e]) => {
      if (!meals.some(m => m.id === id)) throw new Error(`Masa ${id} din ${d} nu există în jurnal.`);
      if (!isObj(e) || !isNum(e.kcal) || !isNum(e.protein)) throw new Error('O estimare de masă nu are kcal și protein numerice.');
      est[id] = { kcal: Math.round(e.kcal), protein: Math.round(e.protein), ...(typeof e.note === 'string' && e.note ? { note: e.note.slice(0, 400) } : {}) };
      const m = meals.find(x => x.id === id);
      preview.push([`${fmtShort(d)} · ${MEALT.find(x => x[0] === m.type)?.[1] || 'masă'}`, `~${est[id].kcal} kcal, ${est[id].protein} g proteine`]);
    });
    ops.push({ file: `days/${d.slice(0, 7)}.json`, key: d, mealsEst: est });
  });
  Object.entries(j.coach || {}).forEach(([d, c]) => {
    if (!isDate(d) || !isObj(c) || !isNum(c.kcal) || !isNum(c.protein)) throw new Error('coach are o dată sau valori greșite.');
    ops.push({ file: `days/${d.slice(0, 7)}.json`, key: d, patch: { coach: { kcal: Math.round(c.kcal), protein: Math.round(c.protein), foodNote: String(c.foodNote || '').slice(0, 600) } } });
    preview.push([`${fmtShort(d)} · total`, `~${Math.round(c.kcal)} kcal, ${Math.round(c.protein)} g proteine`]);
  });
  Object.entries(j.plans || {}).forEach(([d, p]) => {
    if (!isDate(d)) throw new Error('Un plan are o dată greșită.');
    if (p !== null && (!isObj(p) || typeof p.title !== 'string' || (p.blocks && !Array.isArray(p.blocks)))) throw new Error(`Planul pentru ${d} nu are formatul corect.`);
    ops.push({ file: `plan/${d.slice(0, 7)}.json`, key: d, replace: true, patch: p === null ? null : { ...p, date: d } });
    preview.push([`Plan ${fmtShort(d)}`, p === null ? 'șters' : p.title]);
  });
  if (j.index != null) {
    if (!isObj(j.index)) throw new Error('index trebuie să fie un obiect.');
    ops.push({ file: 'index.json', key: null, patch: j.index });
    preview.push(['Rezumat (index)', Object.keys(j.index).join(', ')]);
  }
  if (j.journal != null) {
    if (typeof j.journal !== 'string') throw new Error('journal trebuie să fie text.');
    ops.push({ file: 'coach/jurnal.md', journal: j.journal.slice(0, 2000), date: today() });
    preview.push(['Jurnalul antrenorului', j.journal.split('\n')[0].slice(0, 80)]);
  }
  if (!ops.length) throw new Error('Răspunsul nu conține nimic de aplicat.');
  return { ops, preview };
}

// Same formula lives in COACH.md; the coach stores the total for past days in index.json.altitude.
const SUMMIT = 8849;
const ALT_RULES = { complet: 30, partial: 20, minim: 12, outdoor: 50, cardioPer2Min: 1, cardioMax: 20, fullDay: 5 };

function dayMeters(day) {
  if (!day) return 0;
  let m = ALT_RULES[day.log?.completed] || 0;
  if (day.outdoor && (day.outdoor.minutes || day.outdoor.km)) m += ALT_RULES.outdoor;
  const cm = (day.cardio || []).reduce((a, c) => a + (c.minutes || 0), 0);
  m += Math.min(ALT_RULES.cardioMax, Math.floor(cm / 2) * ALT_RULES.cardioPer2Min);
  if (day.weight != null && (day.meals || []).length >= 2) m += ALT_RULES.fullDay;
  return m;
}
function altitude() {
  const a = S.index?.altitude || {};

  const through = a.through || '0000-00-00';
  Object.entries(S.days).forEach(([d, day]) => { if (d > through && d <= today()) m += dayMeters(day); });
  return Math.min(SUMMIT, m);
}
const PROFILE = [[0, 50], [30, 44], [55, 48], [85, 36], [110, 40], [140, 28], [170, 32], [205, 22], [235, 26], [265, 16], [295, 20], [330, 10], [360, 13], [400, 3]];
function profileY(x) {
  for (let i = 1; i < PROFILE.length; i++) {
    const [x0, y0] = PROFILE[i - 1], [x1, y1] = PROFILE[i];
    if (x <= x1) return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
  }
  return PROFILE[PROFILE.length - 1][1];
}
function renderAltitude() {
  const el = $('#altitude'); if (!el) return;
  if (!S.ready.days) { el.innerHTML = ''; return; }
  const m = altitude(), x = 400 * m / SUMMIT;
  const pts = PROFILE.map(p => p.join(',')).join(' ');
  const done = PROFILE.filter(p => p[0] < x).concat([[x, profileY(x)]]).map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
  const next = CAMPS.find(c => c[0] > m);
  el.innerHTML = `<div class="alt-head"><span><b>${fmtN(m, 0)} m</b> din ${fmtN(SUMMIT, 0)}</span><span>${next ? `${esc(next[1])} la ${fmtN(next[0], 0)} m` : 'Ai ajuns pe vârf'}</span></div>
    <svg viewBox="0 -6 400 62" aria-label="Profilul traseului: ${fmtN(m, 0)} metri din ${fmtN(SUMMIT, 0)}" role="img">

      ${CAMPS.slice(0, -1).map(([cm]) => { const cx = 400 * cm / SUMMIT; return `<circle class="camp" cx="${cx.toFixed(1)}" cy="${profileY(cx).toFixed(1)}" r="3"/>`; }).join('')}
      <circle class="peak" cx="400" cy="3" r="4"/>
      <circle class="me" cx="${x.toFixed(1)}" cy="${profileY(x).toFixed(1)}" r="6"/>
    </svg>`;
}

const SESS = { A: 'var(--c-a)', B: 'var(--c-b)', C: 'var(--c-c)', D: 'var(--c-d)', 'AFARĂ': 'var(--c-out)' };
function loggedSomething(day) { return !!day && (day.weight != null || day.steps != null || (day.meals || []).length || day.log?.completed || day.outdoor); }
function streak() {
  let d = today(); if (!loggedSomething(S.days[d])) d = addDays(d, -1);
  let n = 0; while (loggedSomething(S.days[d])) { n++; d = addDays(d, -1); }
  return n;
}
function todayHero(d, day) {
  const plan = S.plans[d];
  const checks = [
    ['Greutate', day.weight != null],
    ['Pași ieri', S.days[addDays(d, -1)]?.steps != null],
    ['Mese', (day.meals || []).length >= 2],
    [plan?.blocks?.length ? 'Antrenament' : 'Mișcare', !!(day.log?.completed && day.log.completed !== 'sarit') || !!day.outdoor || !!(day.cardio || []).length]
  ];
  const done = checks.filter(c => c[1]).length;
  const C = 2 * Math.PI * 40, off = C * (1 - done / checks.length);
  const st = streak();
  return `<section class="card"><div class="today-hero">
    <div class="ring"><svg viewBox="0 0 92 92"><circle class="trk" cx="46" cy="46" r="40"/><circle class="val" cx="46" cy="46" r="40" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg><div class="lbl"><b>${done}/${checks.length}</b><span>bifate</span></div></div>
    <div class="sec"><div class="checks">${checks.map(([n, on]) => `<span class="${on ? 'on' : ''}"><i>${on ? '✓' : ''}</i>${n}</span>`).join('')}</div>
    <div class="streak"><b>${st}</b> ${st === 1 ? 'zi' : 'zile'} la rând cu jurnalul completat</div></div>
  </div></section>`;
}
function sessionHTML(p, day, isFb) {

  if (p.setup?.length) h += `<section class="card setup"><span class="eyebrow">Asamblează înainte de start</span><ul>${p.setup.map(s => `<li>${esc(s)}</li>`).join('')}</ul></section>`;

function itemHTML(it, day) {

/* ---------- logging a workout: one tap when it went as planned, details only for what changed ---------- */
const CH_STATUS = [['plan', 'Ca în plan'], ['usor', 'Mai ușor'], ['putine', 'Mai puține rep.'], ['sarit', 'Sărit']];
const CH_FLAGS = [['ciudat', 'Se simte ciudat'], ['executie', 'Nu cred că îl fac corect'], ['durere', 'Mă doare ceva']];
function changeLine(c) {
  const bits = [];
  if (c.status === 'usor') bits.push(`mai ușor${c.kg != null ? ': ' + fmtN(c.kg) + ' kg' : ''}`);
  if (c.status === 'putine') bits.push(`mai puține repetări${c.reps ? ': ' + c.reps : ''}`);

  (c.flags || []).forEach(f => bits.push(CH_FLAGS.find(x => x[0] === f)?.[1].toLowerCase() || f));

  return bits.join(' · ');
}
const canLog = d => d === today() || d === addDays(today(), -1);
function sessionExercises(session) {
  const out = [];

}
function doneHTML(day, session, isFb, d) {

    h += `<details class="more"><summary>Mai multe detalii (opțional)</summary><div class="sec">

function changesSheet(session) {
  const d = S.date, prev = S.days[d]?.log?.changes || {};
  const exs = sessionExercises(session);
  const st = Object.fromEntries(exs.map(it => [it.ex, { status: 'plan', flags: [], note: '', ...(prev[it.ex] || {}) }]));
  openSheet();
  const p = $('#sheetPanel');
  const draw = () => {
    p.innerHTML = `<div class="sheet-head"><h2>Ce a fost altfel</h2><button class="iconbtn" data-act="close" aria-label="Închide">×</button></div>
      <p class="muted small">Atinge doar exercițiile care n-au mers ca în plan. Restul rămân „ca în plan”.</p>
      ${exs.map(it => { const s = st[it.ex]; const name = it.name || S.catalog[it.ex]?.name || it.ex; return `<section class="card ch-row" data-ex="${esc(it.ex)}">
        <div class="row between"><strong>${esc(name)}</strong><span class="muted small">${esc(it.sets ? `${it.sets} × ${it.reps}` : it.dose || '')}${it.load ? ' · ' + esc(it.load) : ''}</span></div>
        <div class="chips">${CH_STATUS.map(([k, n]) => `<button type="button" class="chip" data-st="${k}" aria-pressed="${s.status === k}">${n}</button>`).join('')}</div>
        ${s.status === 'usor' ? `<label class="f">Cu ce greutate (kg)<input type="text" inputmode="decimal" data-k="kg" value="${s.kg ?? ''}" placeholder="${it.kg ?? ''}"></label>` : ''}

        ${s.status !== 'plan' || s.flags.length || s.note || s.open ? `<div class="chips">${CH_FLAGS.map(([k, n]) => `<button type="button" class="chip" data-fl="${k}" aria-pressed="${s.flags.includes(k)}">${n}</button>`).join('')}</div>
        <label class="f">Notiță<input type="text" data-k="note" value="${esc(s.note || '')}" placeholder="ex. mă trage umărul stâng"></label>`

      </section>`; }).join('')}
      <div class="row"><button class="btn primary" id="ch-save">Notează</button><button class="btn ghost" data-act="close">Renunță</button></div>`;
    $$('.ch-row', p).forEach(row => {
      const s = st[row.dataset.ex];
      $$('[data-st]', row).forEach(b => b.onclick = () => { collect(); s.status = b.dataset.st; draw(); });
      $$('[data-fl]', row).forEach(b => b.onclick = () => {
        collect();
        if (b.dataset.fl === 'open') s.open = true;

        if (s.status === 'plan' && !s.flags.length && !s.note) return;
        const c = { status: s.status };
        if (s.status === 'usor' && s.kg != null) c.kg = s.kg;

    };

const EVENTS = [['party', 'Party'], ['bere', 'Ieșire la bere'], ['date', 'Date'], ['masa', 'Ieșire la masă'], ['nunta', 'Nuntă / botez'], ['altul', 'Altă ocazie']];

/* ---------- progress ---------- */
function svgChart(o) {
  const W = 640, H = o.h || 190, L = 44, R = 10, T = 12, B = 26;
  const n = o.dates.length;
  let vals = o.series.flatMap(s => s.values.filter(v => v != null));
  if (!vals.length) return `<p class="empty">Nu sunt date încă în intervalul ales.</p>`;
  if (o.band) vals = vals.concat(o.band);
  let lo = o.yMin ?? Math.min(...vals), hi = o.yMax ?? Math.max(...vals);
  if (lo === hi) { lo -= 1; hi += 1; }
  const pv = (hi - lo) * 0.08; if (o.yMin == null) lo -= pv; if (o.yMax == null) hi += pv;
  const xc = i => L + (i + 0.5) * (W - L - R) / n;
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4; g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmtN(v, o.dec ?? 0)}</text>`; }
  if (o.band) g += `<rect class="band" x="${L}" width="${W - L - R}" y="${y(o.band[1])}" height="${Math.max(1, y(o.band[0]) - y(o.band[1]))}"/>`;
  const step = Math.max(1, Math.ceil(n / 6));
  for (let i = 0; i < n; i += step) g += `<text x="${xc(i)}" y="${H - 8}" text-anchor="middle">${fmtShort(o.dates[i])}</text>`;
  const bw = Math.max(2, (W - L - R) / n * 0.62);
  o.series.forEach(s => {
    if (s.type === 'bars') s.values.forEach((v, i) => { if (v != null) g += `<rect class="${s.cls || 'bar'}" x="${xc(i) - bw / 2}" width="${bw}" y="${y(v)}" height="${Math.max(0, y(Math.max(lo, 0)) - y(v))}" rx="1.5"/>`; });
    if (s.type === 'dots') s.values.forEach((v, i) => { if (v != null) g += `<circle class="${s.clsFn ? s.clsFn(v, i) : (s.cls || 'dot')}" cx="${xc(i)}" cy="${y(v)}" r="${s.r || 3.5}"/>`; });
    if (s.type === 'line') { let d = '', pen = false; s.values.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${xc(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; }); g += `<path class="${s.cls || 'line'}" d="${d}"/>`; }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'grafic')}">${g}</svg>`;
}
function viewProgress() {
  const t = today();
  const all = Object.keys(S.days).sort();
  const first = all[0] || t;
  const span = S.range === 0 ? Math.max(7, daysBetween(first, t) + 1) : S.range;
  const dates = []; for (let i = span - 1; i >= 0; i--) dates.push(addDays(t, -i));
  const D = d => S.days[d] || {};
  const w = dates.map(d => D(d).weight ?? null);
  const wAvg = rolling(dates, d => D(d).weight ?? null);
  const steps = dates.map(d => D(d).steps ?? null);
  const kcal = dates.map(d => dayKcal(D(d)));
  const pain = dates.map(d => maxPain(D(d)));
  const last7 = []; for (let i = 0; i < 7; i++) last7.push(addDays(t, -i));
  const avg = arr => { const v = arr.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const curAvg = rolling([t], d => D(d).weight ?? null)[0];
  const start = S.profile?.startWeight;
  const workouts = last7.filter(d => ['complet', 'partial', 'minim'].includes(D(d).log?.completed)).length;
  const tg = S.profile?.targets || {};
  const rng = [[30, '30 zile'], [90, '90 zile'], [0, 'Tot']];
  return `<div class="chips">${rng.map(([v, n]) => `<button class="chip" data-act="range" data-v="${v}" aria-pressed="${S.range === v}">${n}</button>`).join('')}</div>

/* ---------- calendar ---------- */
function mondayOf(s) { const d = parse(s); const k = (d.getDay() + 6) % 7; return addDays(s, -k); }
function viewCalendar() {
  const t = today();
  const start = S.calStart || mondayOf(t);
  let h = `<div class="row between"><button class="btn sm" data-act="cal" data-n="-7">‹ Săpt. anterioară</button><button class="btn sm primary" data-act="event-new">+ Ocazie</button><button class="btn sm" data-act="cal" data-n="7">Săpt. următoare ›</button></div>`;
  h += '<div class="weeks">';
  for (let w = 0; w < 2; w++) {
    const ws = addDays(start, w * 7);
    h += `<section class="card"><h3>Săptămâna ${fmtShort(ws)} – ${fmtShort(addDays(ws, 6))}</h3><div class="cal">`;
    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i), day = S.days[d] || {}, p = S.plans[d], dt = parse(d);
      const c = day.log?.completed;
      const st = c === 'complet' || c === 'partial' ? `<span class="status ok">${c === 'complet' ? 'Făcut' : 'Parțial'}</span>` : c === 'minim' ? `<span class="status min">Minim</span>` : c === 'sarit' ? `<span class="status skip">Sărit</span>` : '';
      h += `<div class="calday ${d === t ? 'today' : ''}"><div class="dn" style="--sess:${p ? SESS[p.code] || 'var(--accent)' : 'transparent'}"><small>${ZS[dt.getDay()]}</small>${dt.getDate()}</div><div class="calbody">
        <div class="row">${p ? `<button class="linkbtn" data-act="goto" data-date="${d}">${esc(p.title)}</button>` : `<span class="muted small">fără plan</span>`}${st}${day.party ? '<span class="status">party</span>' : ''}${(day.events || []).map(e => `<span class="status ev">${esc(eventName(e.type))}${e.time ? ' ' + esc(e.time) : ''}</span>`).join('')}</div>
        <select data-cal="${d}" aria-label="Tipul zilei ${fmtShort(d)}">${KINDS.map(([k, l]) => `<option value="${k}" ${day.kind === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      </div></div>`;
    }
    h += `</div></section>`;
  }
  h += '</div>';
  h += `<p class="muted small">Marchează din timp zilele de afară, kineto sau indisponibile; programul săptămânii se generează după ele.</p>`;
  return h;
}

/* ---------- uploads ---------- */
async function shrink(file, max = 1600) {
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    return b ? { blob: b, type: 'image/jpeg' } : { blob: file, type: file.type };
  } catch (e) { return { blob: file, type: file.type }; }
}
const blobB64 = b => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(b); });
async function uploadFiles(files) {
  const ids = []; toast('Se încarcă pozele…');
  for (const f of files) {
    try {
      const { blob, type } = await shrink(f);
      const ext = type === 'image/png' ? 'png' : 'jpg';
      const path = `photos/${S.date}-${uid()}.${ext}`;
      QUEUE.push({ file: path, photo: true, b64: await blobB64(blob) }); saveQueue();
      PHOTO[path] = URL.createObjectURL(blob); ids.push(path);
    } catch (e) { toast('O poză nu s-a putut pregăti.'); }
  }
  if (ids.length) toast(ids.length === 1 ? 'Poza a fost încărcată.' : `${ids.length} poze încărcate.`);
  return ids;
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'tab') { S.tab = b.dataset.tab; S.confirm = null; try { localStorage.setItem('dsp-tab', S.tab); } catch (er) {} render(); window.scrollTo(0, 0); }
  else if (a === 'day') { S.date = addDays(S.date, +b.dataset.n); S.confirm = null; render(); ensureRange(S.date, S.date); }
  else if (a === 'pull') pull();
  else if (a === 'review') reviewSheet();
  else if (a === 'done-all' && canLog(S.date)) {
    const fb = S.fallback[S.date] || S.days[S.date]?.log?.completed === 'minim';
    saveDay(S.date, { log: { completed: fb ? 'minim' : 'complet', changes: null, skipReason: null } });
    toast('Bravo! Notat. Trimiți cu butonul de jos.');
  }
  else if (a === 'skip' && canLog(S.date)) saveDay(S.date, { log: { completed: 'sarit', changes: null } });
  else if (a === 'changes' && canLog(S.date)) changesSheet(S.plans[S.date]);
  else if (a === 'manual') manualSheet();
  else if (a === 'pack-build') {
    b.disabled = true; $('#packInfo').textContent = 'Descarc datele din GitHub…';

      PACK = await buildPack();
      $('#packText').value = PACK;
      const copied = await copyText(PACK);
      $('#packInfo').textContent = `${Math.round(new Blob([PACK]).size / 1024)} KB. ${copied ? 'Copiat. Lipește-l într-o conversație nouă cu Claude.' : 'Selectează tot textul de mai sus și copiază-l.'}`;
      $('#packCopy').hidden = false;
    } catch (e) { $('#packInfo').textContent = errText(e); }
    b.disabled = false;
  }
  else if (a === 'pack-copy') { const ok = await copyText(PACK); $('#packInfo').textContent = ok ? 'Copiat din nou.' : 'Selectează tot textul și copiază-l.'; }
  else if (a === 'answer-check') {
    const box = $('#answerPreview');

    } catch (e) { IMPORT = null; box.innerHTML = `<p class="small" style="color:var(--bad)">${esc(e.message)}</p>`; }
  }
  else if (a === 'answer-apply' && IMPORT) {
    b.disabled = true;
    const ok = await sendAll(IMPORT.ops, `Antrenor: manual (telefon) · ${IMPORT.preview.length} modificări`, false);
    if (ok) { IMPORT = null; closeSheet(); toast('Răspunsul antrenorului a fost salvat în GitHub.'); pull(); }
    else b.disabled = false;
  }
  else if (a === 'event-new') eventSheet({ id: uid(), date: S.tab === 'calendar' ? today() : S.date }, null);
  else if (a === 'event-edit') { const e = (S.days[b.dataset.date]?.events || []).find(x => x.id === b.dataset.id); if (e) eventSheet({ ...e, date: b.dataset.date }, b.dataset.date); }
  else if (a === 'event-del') { const dt = b.dataset.date; S.confirm = null; saveDay(dt, { events: (S.days[dt]?.events || []).filter(x => x.id !== b.dataset.id) }); }
  else if (a === 'cardio-new') cardioSheet({ id: uid(), type: S.days[S.date]?.kind === 'sala' ? 'banda' : 'bicicleta' }, true);
  else if (a === 'cardio-edit') { const c = (S.days[S.date]?.cardio || []).find(x => x.id === b.dataset.id); if (c) cardioSheet(c, false); }
  else if (a === 'cardio-del') { const list = (S.days[S.date]?.cardio || []).filter(x => x.id !== b.dataset.id); S.confirm = null; saveDay(S.date, { cardio: list }); }
  else if (a === 'send') sendAll();
  else if (a === 'discard-ask') $('#discardRow').innerHTML = `<span class="small">Ștergi toate modificările netrimise?</span><button class="btn sm danger" data-act="discard">Da, renunță</button><button class="btn sm ghost" data-act="review">Nu</button>`;
  else if (a === 'discard') { QUEUE = []; saveQueue(); closeSheet(); toast('Modificările netrimise au fost anulate.'); pull(); }
  else if (a === 'update-app') updateApp();
  else if (a === 'photo') { openSheet(); const p = b.dataset.path; $('#sheetPanel').innerHTML = `<div class="sheet-head"><h2>Poză</h2><button class="iconbtn" data-act="close" aria-label="Închide">×</button></div><img data-photo="${esc(p)}" alt="Poză" style="border-radius:12px">`; hydratePhotos($('#sheetPanel')); }
  else if (a === 'gh-save') {

    if (tok && !/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(tok)) { toast('Ce ai lipit nu e un token: trebuie să înceapă cu „github_pat_” și să fie un singur șir lung, fără spații.'); return; }
    GH.owner = $('#gh-owner').value.trim() || GH.owner; GH.repo = $('#gh-repo').value.trim() || GH.repo;

  }

  else if (a === 'today') { S.date = today(); render(); }

    const v = b.dataset.str ? b.dataset.val : +b.dataset.val;
    const date = b.dataset.date || S.date;
    const cur = b.getAttribute('aria-pressed') === 'true';
    await saveDay(date, nest(b.dataset.path, cur ? null : v));

    await saveTo('config/profile.json', null, { [el.dataset.prof]: v }); toast('Notat. Trimite cu butonul de jos.'); return;
  }
  if (el.dataset.set) {
    const ex = el.dataset.set;
    const wrap = el.closest('[data-exwrap]');
    const rows = {};
    $$('[data-set]', wrap).forEach(x => {
      const i = +x.dataset.i; rows[i] ||= {};
      rows[i][x.dataset.f] = x.type === 'checkbox' ? x.checked : toNum(x.value);
    });
    const arr = Object.keys(rows).sort((a, b) => a - b).map(k => rows[k]);
    await saveDay(S.date, { log: { sets: { [ex]: arr } } }); return;
  }
  if (el.dataset.path) {
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.type === 'num') v = toNum(v);
    else if (typeof v === 'string') v = v.trim();
    await saveDay(el.dataset.date || S.date, nest(el.dataset.path, v));
  }
});
$('#view').addEventListener('input', e => {
  if (e.target.id !== 'catSearch') return;
  const qv = e.target.value.trim().toLowerCase();
  $$('[data-catgroup]').forEach(g => {
    let any = false;
    $$('.cat-item', g).forEach(i => { const hit = !qv || i.dataset.name.includes(qv); i.hidden = !hit; any ||= hit; });
    g.hidden = !any;
  });
});

/* ---------- boot ---------- */
async function updateApp() {
  toast('Caut actualizări…');
  try { const reg = await navigator.serviceWorker?.getRegistration(); await reg?.update(); } catch (e) {}
  location.reload();
}
function init() {
  if (GH.token) cacheLoad();
  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  pull();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && GH.token && !sending) pull(); });
}
init();
</script>
</body>
</html>
